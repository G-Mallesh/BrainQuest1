<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - BrainQuest Kids</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>🌟 BrainQuest Kids</h1>

        <h2>🔐 Student Login</h2>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <p>{{ message }}</p>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST"
              action="{{ url_for('login') }}">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                🚀 Login
            </button>

        </form>


        <p class="login-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>


        <p class="login-link">

            <a href="{{ url_for('home') }}">
                🏠 Back to Home
            </a>

        </p>

    </div>

</div>

</body>

</html>
