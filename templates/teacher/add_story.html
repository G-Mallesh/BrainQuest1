
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Story - BrainQuest</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="teacher-container">

    <div class="teacher-header">

        <h1>➕ Add Story</h1>

        <a href="{{ url_for('teacher_stories') }}">
            ← Stories
        </a>

    </div>

    <section class="teacher-form-section">

        <!-- multipart/form-data is required for file uploads -->
        <form method="POST"
              action="{{ url_for('teacher_add_story') }}"
              enctype="multipart/form-data"
              class="teacher-form">

            <label for="title">Story Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter story title"
                required
            >

            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="3"
                placeholder="Short story description"
            ></textarea>

            <label for="story_text">Story Content</label>

            <textarea
                id="story_text"
                name="story_text"
                rows="12"
                placeholder="Write the complete story..."
                required
            ></textarea>

            <label for="category">Category</label>

            <select id="category" name="category">

                <option value="animal">Animal</option>
                <option value="cartoon">Cartoon</option>
                <option value="moral">Moral</option>
                <option value="science">Science</option>
                <option value="adventure">Adventure</option>
                <option value="educational">Educational</option>
                <option value="other">Other</option>

            </select>

            <label for="class_id">Class</label>

            <select id="class_id" name="class_id">

                <option value="">All Classes</option>

                {% for class_item in classes %}
                <option value="{{ class_item.id }}">
                    {{ class_item.class_name }}
                </option>
                {% endfor %}

            </select>

            <label for="reading_time">
                Reading Time (minutes)
            </label>

            <input
                type="number"
                id="reading_time"
                name="reading_time"
                value="5"
                min="1"
                max="60"
                required
            >

            <!-- Story cover image upload -->
            <label for="cover_image">
                Cover Image
            </label>

            <input
                type="file"
                id="cover_image"
                name="cover_image"
                accept="image/png,image/jpeg,image/webp,image/gif"
            >

            <small>
                Allowed formats: JPG, PNG, WEBP, GIF.
            </small>

            <button
                type="submit"
                class="teacher-primary-button"
            >
                💾 Save Story
            </button>

        </form>

    </section>

</div>

</body>
</html>
