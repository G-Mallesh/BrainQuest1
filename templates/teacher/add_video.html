<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Add Video
    </title>

    <link rel="stylesheet"
          href="{{ url_for(
              'static',
              filename='css/style.css'
          ) }}">

</head>

<body>

<div class="teacher-container">

    <div class="teacher-header">

        <h1>
            ➕ Add Video
        </h1>

        <a href="{{ url_for(
            'teacher_videos'
        ) }}">
            ← Videos
        </a>

    </div>


    <section class="teacher-form-section">

        <form
            method="POST"
            class="teacher-form"
        >

            <label>
                Video Title
            </label>

            <input
                type="text"
                name="title"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                rows="4"
            ></textarea>


            <label>
                Video File Path
            </label>

            <input
                type="text"
                name="video_path"
                placeholder="videos/education/math.mp4"
                required
            >


            <label>
                Thumbnail Path
            </label>

            <input
                type="text"
                name="thumbnail_path"
                placeholder="images/videos/math.jpg"
            >


            <label>
                Category
            </label>

            <select name="category">

                <option value="education">
                    Education
                </option>

                <option value="animal">
                    Animal
                </option>

                <option value="story">
                    Story
                </option>

                <option value="drawing">
                    Drawing
                </option>

                <option value="game">
                    Game
                </option>

                <option value="other">
                    Other
                </option>

            </select>


            <label>
                Video Type
            </label>

            <select name="video_type">

                <option value="education">
                    Education
                </option>

                <option value="animal">
                    Animal
                </option>

                <option value="story">
                    Story
                </option>

                <option value="drawing">
                    Drawing
                </option>

                <option value="game">
                    Game
                </option>

                <option value="other">
                    Other
                </option>

            </select>


            <label>
                Class
            </label>

            <select name="class_id">

                <option value="">
                    All Classes
                </option>

                {% for class_item in classes %}

                <option value="{{ class_item.id }}">

                    {{ class_item.class_name }}

                </option>

                {% endfor %}

            </select>


            <label>
                Duration (seconds)
            </label>

            <input
                type="number"
                name="duration_seconds"
                value="0"
                min="0"
            >


            <button
                type="submit"
                class="teacher-primary-button"
            >
                💾 Save Video
            </button>

        </form>

    </section>

</div>

</body>

</html>
