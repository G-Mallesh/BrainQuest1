<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Add Question - BrainQuest Kids
    </title>

    <link rel="stylesheet"
          href="{{ url_for(
              'static',
              filename='css/style.css'
          ) }}">

</head>

<body>

<div class="teacher-container">


    <div class="teacher-header">

        <h1>
            ➕ Add Question
        </h1>

        <a
            href="{{ url_for(
                'teacher_questions'
            ) }}"
        >
            ← Questions
        </a>

    </div>


    <section class="teacher-form-section">

        <form
            method="POST"
            class="teacher-form"
        >


            <label>
                Game
            </label>

            <select name="game_id">

                <option value="">
                    General Quiz
                </option>

                {% for game in games %}

                <option value="{{ game.id }}">

                    {{ game.title }}

                </option>

                {% endfor %}

            </select>


            <label>
                Question
            </label>

            <textarea
                name="question_text"
                rows="4"
                placeholder="Enter question"
                required
            ></textarea>


            <label>
                Option A
            </label>

            <input
                type="text"
                name="option_a"
                required
            >


            <label>
                Option B
            </label>

            <input
                type="text"
                name="option_b"
                required
            >


            <label>
                Option C
            </label>

            <input
                type="text"
                name="option_c"
                required
            >


            <label>
                Option D
            </label>

            <input
                type="text"
                name="option_d"
                required
            >


            <label>
                Correct Answer
            </label>

            <select
                name="correct_answer"
                required
            >

                <option value="">
                    Select answer
                </option>

                <option value="A">
                    A
                </option>

                <option value="B">
                    B
                </option>

                <option value="C">
                    C
                </option>

                <option value="D">
                    D
                </option>

            </select>


            <label>
                Explanation
            </label>

            <textarea
                name="explanation"
                rows="4"
                placeholder="Explain the answer"
            ></textarea>


            <label>
                Points
            </label>

            <input
                type="number"
                name="points"
                value="10"
                min="1"
                max="100"
            >


            <label>
                Difficulty
            </label>

            <select name="difficulty">

                <option value="easy">
                    Easy
                </option>

                <option value="medium">
                    Medium
                </option>

                <option value="hard">
                    Hard
                </option>

            </select>


            <button
                type="submit"
                class="teacher-primary-button"
            >
                💾 Save Question
            </button>

        </form>

    </section>

</div>

</body>

</html>
