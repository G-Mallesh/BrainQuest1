<h1>❓ Questions</h1>
  <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >
<a href="{{ url_for('admin_dashboard') }}">
    ← Admin Dashboard
</a>

<br><br>

<table class="student-table">

<thead>
<tr>
    <th>ID</th>
    <th>Game</th>
    <th>Question</th>
    <th>Answer</th>
    <th>Points</th>
    <th>Difficulty</th>
</tr>
</thead>

<tbody>

{% for q in questions %}

<tr>

    <td>{{ q.id }}</td>

    <td>{{ q.game_title or '-' }}</td>

    <td>{{ q.question_text }}</td>

    <td>{{ q.correct_answer }}</td>

    <td>{{ q.points }}</td>

    <td>{{ q.difficulty }}</td>

</tr>

{% endfor %}

</tbody>

</table>
