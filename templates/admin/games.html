<h1>🎮 Games</h1>
  <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >
<a href="{{ url_for('admin_dashboard') }}">
    ← Admin Dashboard
</a>

<br>
<form method="GET"
      action="{{ url_for('admin_games') }}">

    <input
        type="text"
        name="search"
        placeholder="Search games..."
        value="{{ search }}"
    >

    <button type="submit">
        🔎 Search
    </button>

</form>

</br>

<div class="admin-grid">

{% for game in games %}

    <div class="admin-card">

        <h3>{{ game.title }}</h3>

        <p>
            Type: {{ game.game_type }}
        </p>

        <p>
            Difficulty: {{ game.difficulty }}
        </p>

        <p>
            Points: {{ game.points }}
        </p>

        <p>
            Status: {{ game.status }}
        </p>
         <br>

{% if game.status == 'active' %}

<form
    method="POST"
    action="{{ url_for(
        'admin_game_status',
        game_id=game.id
    ) }}"
    style="display:inline;"
>

    <input
        type="hidden"
        name="status"
        value="inactive"
    >

    <button type="submit">
        🔴 Deactivate
    </button>

</form>

{% else %}

<form
    method="POST"
    action="{{ url_for(
        'admin_game_status',
        game_id=game.id
    ) }}"
    style="display:inline;"
>

    <input
        type="hidden"
        name="status"
        value="active"
    >

    <button type="submit">
        🟢 Activate
    </button>

</form>

{% endif %}

<form
    method="POST"
    action="{{ url_for(
        'admin_delete_game',
        game_id=game.id
    ) }}"
    style="display:inline;"
    onsubmit="return confirm(
        'Delete this game?'
    );"
>

    <button
        type="submit"
        class="delete-button"
    >
        🗑️ Delete
    </button>

</form>
    </div>

{% endfor %}

</div>
