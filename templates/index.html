
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrainQuest Kids</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .parent-login-btn {
            display: inline-block;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin: 8px;
            transition: 0.3s ease;
        }

        .parent-login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .buttons a {
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="home-container">

        <h1>🌟 BrainQuest Kids 🌟</h1>

        <h2>Learn • Play • Create • Grow</h2>

        <p>Welcome to BrainQuest Kids!</p>

        <div class="buttons">

            <a href="{{ url_for('register') }}">
                🚀 Register
            </a>

            <a href="{{ url_for('login') }}">
                🔐 Login
            </a>

            <a href="{{ url_for('test_db') }}">
                🗄️ Test Database
            </a>

            <a href="{{ url_for('parent_login') }}"
               class="parent-login-btn">
                👨‍👩‍👧 Parent Login
            </a>

            <a href="{{ url_for('parent_register') }}"
               class="parent-login-btn">
                📝 Parent Registration
            </a>

        </div>

    </div>

</body>

</html>
