<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Link Child</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        .info {
            background: #f3e8ff;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            🔗 Link Your Child
        </h1>

        <div class="info">

            Ask your child for their
            <strong>BrainQuest Child Code</strong>.

            <br><br>

            Example:

            <strong>BQ00001</strong>

        </div>

        <form method="POST">

            <label>
                Child Code
            </label>

            <input
                type="text"
                name="child_code"
                placeholder="BQ00001"
                required
            >

            <label>
                Relationship
            </label>

            <select
                name="relationship"
                required
            >

                <option value="Parent">
                    Parent
                </option>

                <option value="Father">
                    Father
                </option>

                <option value="Mother">
                    Mother
                </option>

                <option value="Guardian">
                    Guardian
                </option>

            </select>

            <button type="submit">
                🔗 Link Child
            </button>

        </form>

        <a
            class="back"
            href="{{ url_for('parent_dashboard') }}"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
