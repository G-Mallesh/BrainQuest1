<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Parent Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .login-container {
            max-width: 450px;
            margin: 70px auto;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.07);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #6b7280;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>
            👨‍👩‍👧 Parent Login
        </h1>

        <p>
            Monitor your child's learning progress.
        </p>


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register">

            New Parent?

            <a
                href="{{ url_for(
                    'parent_register'
                ) }}"
            >
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
