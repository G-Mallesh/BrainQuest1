<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Parent Registration</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.07);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>
            👨‍👩‍👧 Parent Registration
        </h1>

        <p class="subtitle">
            Create an account to monitor
            your child's learning journey.
        </p>


        <form
            method="POST"
        >

            <label>
                Full Name *
            </label>

            <input
                type="text"
                name="full_name"
                required
            >


            <label>
                Email *
            </label>

            <input
                type="email"
                name="email"
                required
            >


            <label>
                Phone
            </label>

            <input
                type="tel"
                name="phone"
            >


            <label>
                City
            </label>

            <input
                type="text"
                name="city"
            >


            <label>
                Password *
            </label>

            <input
                type="password"
                name="password"
                minlength="6"
                required
            >


            <button type="submit">
                Create Parent Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a
                href="{{ url_for('parent_login') }}"
            >
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
