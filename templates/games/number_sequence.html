<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Sequence Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-box {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #333;
        }

        .sequence {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
            letter-spacing: 8px;
        }

        input {
            width: 200px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #667eea;
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #4c63d2;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .score {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="game-box">

    <h1>🔢 Number Sequence</h1>

    <p>Find the missing number in the sequence.</p>

    <div class="sequence" id="sequence"></div>

    <input
        type="number"
        id="answer"
        placeholder="Your answer"
    >

    <br>

    <button onclick="checkAnswer()">
        Check Answer
    </button>

    <div id="message"></div>

    <div class="score">
        ⭐ Points: <span id="score">0</span>
    </div>

    <button onclick="newQuestion()">
        Next Question
    </button>

</div>

<script>

let questions = [
    {
        sequence: "2, 4, 6, 8, ?",
        answer: 10
    },
    {
        sequence: "5, 10, 15, 20, ?",
        answer: 25
    },
    {
        sequence: "3, 6, 9, 12, ?",
        answer: 15
    },
    {
        sequence: "1, 4, 7, 10, ?",
        answer: 13
    },
    {
        sequence: "10, 20, 30, 40, ?",
        answer: 50
    },
    {
        sequence: "2, 6, 18, 54, ?",
        answer: 162
    }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

    document.getElementById("sequence").innerText =
        questions[currentQuestion].sequence;

    document.getElementById("answer").value = "";

    document.getElementById("message").innerText = "";
}

function checkAnswer() {

    let answer = Number(
        document.getElementById("answer").value
    );

    let correctAnswer =
        questions[currentQuestion].answer;

    if (answer === correctAnswer) {

        document.getElementById("message").innerText =
            "🎉 Correct! +20 points";

        score += 20;

        document.getElementById("score").innerText =
            score;

    } else {

        document.getElementById("message").innerText =
            "❌ Wrong! Try again.";
    }
}

function newQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        currentQuestion = 0;
    }

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
