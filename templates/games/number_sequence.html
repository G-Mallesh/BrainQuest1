<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Number Sequence - BrainQuest</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 90%;
            max-width: 650px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            font-size: 17px;
        }

        .sequence {
            margin: 35px 0;

            font-size: 36px;

            font-weight: bold;

            letter-spacing: 5px;

            color: #667eea;

            padding: 20px;

            background: #f4f6ff;

            border-radius: 15px;
        }

        input {
            width: 250px;

            padding: 14px;

            font-size: 20px;

            border: 2px solid #667eea;

            border-radius: 10px;

            text-align: center;

            outline: none;
        }

        input:focus {
            border-color: #4d61d1;
        }

        button {
            margin: 12px 5px 0;

            padding: 12px 24px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        button:hover {
            background: #4d61d1;
        }

        #message {
            margin-top: 20px;

            font-size: 20px;

            font-weight: bold;

            min-height: 28px;
        }

        .score {
            margin-top: 15px;

            font-size: 19px;

            font-weight: bold;
        }

        .question-number {
            margin-top: 10px;

            color: #777;
        }

        .back {
            display: inline-block;

            margin-top: 25px;

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="game-container">

    <h1>🔢 Number Sequence</h1>

    <p class="description">
        Find the missing number in the sequence.
    </p>


    <div class="sequence" id="sequence">
        2, 4, 6, 8, ?
    </div>


    <input
        type="number"
        id="answer"
        placeholder="Enter number"
        autocomplete="off"
    >


    <br>


    <button onclick="checkAnswer()">
        ✅ Check Answer
    </button>


    <button onclick="nextQuestion()">
        ➡️ Next
    </button>


    <div id="message"></div>


    <div class="score">
        ⭐ Score:
        <span id="score">0</span>
    </div>


    <div class="question-number">
        Question
        <span id="questionNumber">1</span>
        /
        <span id="totalQuestions">10</span>
    </div>


    <a href="{{ url_for('games') }}" class="back">
        ← Back to Games
    </a>

</div>


<script>

const questions = [

    {
        sequence: "2, 4, 6, 8, ?",
        answer: 10
    },

    {
        sequence: "5, 10, 15, 20, ?",
        answer: 25
    },

    {
        sequence: "3, 6, 9, 12, ?",
        answer: 15
    },

    {
        sequence: "1, 4, 7, 10, ?",
        answer: 13
    },

    {
        sequence: "10, 20, 30, 40, ?",
        answer: 50
    },

    {
        sequence: "2, 4, 8, 16, ?",
        answer: 32
    },

    {
        sequence: "3, 9, 27, 81, ?",
        answer: 243
    },

    {
        sequence: "100, 90, 80, 70, ?",
        answer: 60
    },

    {
        sequence: "1, 2, 4, 8, ?",
        answer: 16
    },

    {
        sequence: "5, 10, 20, 40, ?",
        answer: 80
    }

];


let currentQuestion = 0;

let score = 0;

let answered = false;


function loadQuestion() {

    document.getElementById("sequence").innerText =
        questions[currentQuestion].sequence;

    document.getElementById("answer").value = "";

    document.getElementById("message").innerText = "";

    document.getElementById("questionNumber").innerText =
        currentQuestion + 1;

    document.getElementById("totalQuestions").innerText =
        questions.length;

    answered = false;

    document.getElementById("answer").focus();

}


function checkAnswer() {

    if (answered) {
        return;
    }

    const input =
        document.getElementById("answer");

    const answer =
        Number(input.value);

    if (input.value.trim() === "") {

        document.getElementById("message").innerText =
            "⚠️ Please enter an answer.";

        return;
    }


    const correctAnswer =
        questions[currentQuestion].answer;


    if (answer === correctAnswer) {

        score += 20;

        document.getElementById("score").innerText =
            score;

        document.getElementById("message").innerText =
            "🎉 Correct! +20 points";

        answered = true;

    } else {

        document.getElementById("message").innerText =
            "❌ Wrong answer. Try again!";

    }

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        document.getElementById("sequence").innerText =
            "🎉 Game Complete!";

        document.getElementById("message").innerText =
            "Your final score: " + score + " points";

        document.getElementById("answer").style.display =
            "none";

        return;
    }

    loadQuestion();

}


document
    .getElementById("answer")
    .addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                checkAnswer();

            }

        }
    );


loadQuestion();

</script>

</body>

</html>
